services:
  - type: web
    name: tijori-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -e ."
    startCommand: "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: "gemini-3.8-flash"
      - key: ALLOW_SEED
        value: "false"
        # Set to "true" temporarily after first deploy to seed demo data, then back to "false"
      - key: DATABASE_URL
        fromDatabase:
          name: tijori-db
          property: connectionString

databases:
  - name: tijori-db
    plan: free
    region: singapore
    # Free tier: 90 days, then expires. For hackathon demo this is fine.
    # For longer persistence, upgrade to paid plan.